types:
  - memory_type: experience_memory
    subtype: experience
    owner_type: user
    memory_key_fields:
      - experience_id
      - domain
    required_fields:
      - experience_id
      - domain
    optional_fields:
      - strategy_type
      - title
      - problem_pattern
      - trigger_conditions
      - recommended_actions
      - lessons_learned
      - source_records
      - note
    vote_threshold: 1
    decay_lambda: 0.0
    description_template: "经验卡片 [{domain}/{experience_id}]"
